plugins {
    id 'com.android.application'
}

def signingStorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def signingStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def signingAlias = System.getenv("ANDROID_KEY_ALIAS")

android {
    namespace 'us.ci.socialindia'
    compileSdk 34

    defaultConfig {
        applicationId "us.ci.socialindia"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (signingStorePath) {
                storeFile file(signingStorePath)
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingStorePassword
            }
        }
    }

    buildTypes {
        release {
            if (signingStorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
