    <!-- Inline pre-paint script to prevent dark mode flashing -->
    <script>
      (function() {
        try {
          const uid = localStorage.getItem('socialindia_active_uid');
          const ownerUid = localStorage.getItem('socialindia_theme_owner_uid');
          const theme = (uid && localStorage.getItem('socialindia_theme_' + uid))
            || (uid && ownerUid === uid ? localStorage.getItem('socialindia_theme') : null)
            || (!uid ? localStorage.getItem('socialindia_theme') : null)
            || 'system';
          const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
