name: Deploy SocialIndia Web App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || (echo "npm ci failed, clearing lockfile and running npm install..." && rm -f package-lock.json && npm install --legacy-peer-deps)
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Production Bundle
        run: npm run build
        env:
          CI: false
          NODE_ENV: production

      - name: Verify Build Output
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::Build failed - dist directory not found"
            exit 1
          fi
          echo "Build completed successfully. Found $(find dist -type f | wc -l) files in dist/."

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.30.0

      - name: Generate Firebase Hosting Config
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is empty or not set in GitHub Secrets!"
          fi

          PROJECT_ID=$(node -e "
            try {
              const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
              if (sa.project_id) { console.log(sa.project_id); process.exit(0); }
            } catch(e) {}
            try {
              const cfg = require('./firebase-applet-config.json');
              if (cfg.projectId) { console.log(cfg.projectId); process.exit(0); }
            } catch(e) {}
            console.log('socialindia-cf742');
          ")
          echo "Selected Project ID: $PROJECT_ID"
          echo "{\"projects\":{\"default\":\"$PROJECT_ID\"},\"targets\":{\"$PROJECT_ID\":{\"hosting\":{\"socialindia\":[\"socialindia\"]}}}}" > .firebaserc
          echo '{
            "hosting": {
              "site": "socialindia",
              "public": "dist",
              "ignore": [
                "firebase.json",
                "**/.*",
                "**/node_modules/**"
              ],
              "headers": [
                {
                  "source": "/**/*.xml",
                  "headers": [
                    { "key": "Content-Type", "value": "application/xml; charset=utf-8" },
                    { "key": "X-Robots-Tag", "value": "all" },
                    { "key": "Access-Control-Allow-Origin", "value": "*" }
                  ]
                },
                {
                  "source": "/robots.txt",
                  "headers": [
                    { "key": "Content-Type", "value": "text/plain; charset=utf-8" },
                    { "key": "X-Robots-Tag", "value": "all" }
                  ]
                }
              ],
              "rewrites": [
                {
                  "source": "**",
                  "destination": "/index.html"
                }
              ]
            }
          }' > firebase.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is missing or empty in GitHub Secrets!"
            echo "Please ensure the FIREBASE_SERVICE_ACCOUNT secret is populated in your repository settings (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > sa_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=sa_key.json

          PROJECT_ID=$(node -e "
            try {
              const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
              if (sa.project_id) { console.log(sa.project_id); process.exit(0); }
            } catch(e) {}
            try {
              const cfg = require('./firebase-applet-config.json');
              if (cfg.projectId) { console.log(cfg.projectId); process.exit(0); }
            } catch(e) {}
            console.log('socialindia-cf742');
          ")
          echo "Deploying to Firebase project: $PROJECT_ID (target site: socialindia)..."
          
          # Map target and deploy exclusively to site 'socialindia'
          firebase target:apply hosting socialindia socialindia --project "$PROJECT_ID" || true
          firebase deploy --only hosting:socialindia --project "$PROJECT_ID" --non-interactive || firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive
          
          rm -f sa_key.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
