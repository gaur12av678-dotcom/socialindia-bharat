name: Deploy SocialIndia Web App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || (echo "npm ci failed, clearing lockfile and running npm install..." && rm -f package-lock.json && npm install --legacy-peer-deps)
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Production Bundle
        run: npm run build
        env:
          CI: false
          NODE_ENV: production

      - name: Verify Build Output
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::Build failed - dist directory not found"
            exit 1
          fi
          echo "Build completed successfully. Found $(find dist -type f | wc -l) files in dist/."

      - name: Ensure Sitemap Files Are Included
        run: |
          set -e
          mkdir -p dist
          for file in sitemap.xml video-sitemap.xml sitemap_index.xml robots.txt; do
            if [ -f "public/$file" ]; then
              cp "public/$file" "dist/$file"
            else
              echo "::error::Missing required public/$file"
              exit 1
            fi
          done

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in ("sitemap.xml", "video-sitemap.xml", "sitemap_index.xml"):
              path = Path("dist") / name
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:
                  raise SystemExit(f"Invalid XML in {path}: {exc}")
              if not root.tag.endswith(("urlset", "sitemapindex")):
                  raise SystemExit(f"Unexpected sitemap root element in {path}: {root.tag}")
              print(f"Validated {path}: {root.tag}")
          PY

          echo "Sitemap deployment files:"
          ls -lh dist/sitemap.xml dist/video-sitemap.xml dist/sitemap_index.xml dist/robots.txt

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.30.0

      - name: Generate Firebase Hosting Config
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is empty or not set in GitHub Secrets!"
          fi

          PROJECT_ID=$(node -e "
            try {
              const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
              if (sa.project_id) { console.log(sa.project_id); process.exit(0); }
            } catch(e) {}
            try {
              const cfg = require('./firebase-applet-config.json');
              if (cfg.projectId) { console.log(cfg.projectId); process.exit(0); }
            } catch(e) {}
            console.log('socialindia-cf742');
          ")
          echo "Selected Project ID: $PROJECT_ID"
          echo "{\"projects\":{\"default\":\"$PROJECT_ID\"},\"targets\":{\"$PROJECT_ID\":{\"hosting\":{\"socialindia\":[\"socialindia\"]}}}}" > .firebaserc
          cat > firebase.json <<'JSON'
          {
            "hosting": {
              "site": "socialindia",
              "public": "dist",
              "ignore": [
                "firebase.json",
                "**/.*",
                "**/node_modules/**"
              ],
              "headers": [
                {
                  "source": "**/sitemap.xml",
                  "headers": [
                    { "key": "Content-Type", "value": "application/xml; charset=utf-8" },
                    { "key": "X-Robots-Tag", "value": "all" },
                    { "key": "Cache-Control", "value": "public, max-age=300, must-revalidate" }
                  ]
                },
                {
                  "source": "**/video-sitemap.xml",
                  "headers": [
                    { "key": "Content-Type", "value": "application/xml; charset=utf-8" },
                    { "key": "X-Robots-Tag", "value": "all" },
                    { "key": "Cache-Control", "value": "public, max-age=300, must-revalidate" }
                  ]
                },
                {
                  "source": "**/sitemap_index.xml",
                  "headers": [
                    { "key": "Content-Type", "value": "application/xml; charset=utf-8" },
                    { "key": "X-Robots-Tag", "value": "all" },
                    { "key": "Cache-Control", "value": "public, max-age=300, must-revalidate" }
                  ]
                },
                {
                  "source": "**/robots.txt",
                  "headers": [
                    { "key": "Content-Type", "value": "text/plain; charset=utf-8" },
                    { "key": "X-Robots-Tag", "value": "all" },
                    { "key": "Cache-Control", "value": "public, max-age=300, must-revalidate" }
                  ]
                }
              ],
              "rewrites": [
                {
                  "source": "**",
                  "destination": "/index.html"
                }
              ]
            },
            "firestore": {
              "rules": "firestore.rules"
            },
            "storage": {
              "rules": "storage.rules"
            }
          }
          JSON
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting and Security Rules
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is missing or empty in GitHub Secrets!"
            echo "Please ensure the FIREBASE_SERVICE_ACCOUNT secret is populated in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > sa_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=sa_key.json

          PROJECT_ID=$(node -e "
            try {
              const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
              if (sa.project_id) { console.log(sa.project_id); process.exit(0); }
            } catch(e) {}
            try {
              const cfg = require('./firebase-applet-config.json');
              if (cfg.projectId) { console.log(cfg.projectId); process.exit(0); }
            } catch(e) {}
            console.log('socialindia-cf742');
          ")
          echo "Deploying to Firebase project: $PROJECT_ID (target site: socialindia)..."

          firebase target:apply hosting socialindia socialindia --project "$PROJECT_ID"
          firebase deploy --only hosting:socialindia,firestore:rules,storage:rules --project "$PROJECT_ID" --non-interactive

          rm -f sa_key.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Verify Live Sitemap URLs
        run: |
          set -e
          for file in sitemap.xml video-sitemap.xml sitemap_index.xml robots.txt; do
            url="https://socialindia.web.app/$file"
            echo "Checking $url"
            curl --retry 5 --retry-delay 5 --retry-all-errors -fsSL "$url" -o "/tmp/$file"
            if [ "$file" = "robots.txt" ]; then
              grep -q "Sitemap: https://socialindia.web.app/sitemap.xml" "/tmp/$file"
            else
              grep -q "http://www.sitemaps.org/schemas/sitemap/0.9" "/tmp/$file"
            fi
            echo "OK: $url"
          done
