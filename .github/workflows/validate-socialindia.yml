name: Validate SocialIndia Security Changes

on:
  push:
    branches:
      - "security/**"
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-validate-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build production bundle
        run: npm run build
        env:
          CI: false
          NODE_ENV: production

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Firestore and Storage rules in emulators
        run: |
          cat > firebase.json <<'JSON'
          {
            "firestore": { "rules": "firestore.rules" },
            "storage": { "rules": "storage.rules" },
            "emulators": {
              "firestore": { "port": 8080 },
              "storage": { "port": 9199 },
              "ui": { "enabled": false }
            }
          }
          JSON
          npx --yes firebase-tools@13.30.0 emulators:exec --only firestore,storage --project demo-socialindia "echo 'Firebase security rules parsed successfully'"
