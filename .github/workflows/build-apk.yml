name: Build SocialIndia APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, copilot/fix-android-google-signin]

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses & Prepare Keystore
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license" 2>/dev/null || true
          yes | sdkmanager --licenses 2>/dev/null || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          mkdir -p ~/.android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Restoring persistent Android keystore from secret..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi
          echo "=== APK Signing Certificate Fingerprints (Add SHA-1 to Firebase Console for Native Google Sign-In) ==="
          keytool -list -v -keystore ~/.android/debug.keystore -alias "${ANDROID_KEY_ALIAS:-androiddebugkey}" -storepass "${ANDROID_KEYSTORE_PASSWORD:-android}" 2>/dev/null | grep -E "SHA1:|SHA256:" || true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Inject Optional Google Web Client ID
        run: |
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "Injecting GOOGLE_WEB_CLIENT_ID into strings.xml..."
            python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          path = "app/src/main/res/values/strings.xml"
          tree = ET.parse(path)
          root = tree.getroot()
          client_id = os.environ["GOOGLE_WEB_CLIENT_ID"].strip()
          updated = False
          for elem in root.findall("string"):
              if elem.attrib.get("name") == "google_web_client_id":
                  elem.text = client_id
                  updated = True
          if not updated:
              e = ET.SubElement(root, "string", {"name": "google_web_client_id", "translatable": "false"})
              e.text = client_id
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY
          else
            echo "GOOGLE_WEB_CLIENT_ID not set; APK will use Chrome Custom Tab OAuth relay automatically."
          fi
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew || true

      - name: Build Release & Debug APKs
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
            ./gradlew assembleRelease --no-daemon --stacktrace || true
          else
            gradle assembleDebug --no-daemon --stacktrace
            gradle assembleRelease --no-daemon --stacktrace || true
          fi

          mkdir -p app/build/outputs/apk/release
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Packaging signed installable APK as app-release.apk..."
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release.apk
          fi

      - name: Extract & Show APK SHA-1 / SHA-256 Fingerprints
        id: certs
        run: |
          CERT_INFO=""
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ] && [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            CERT_INFO=$("$APKSIGNER" verify --print-certs "app/build/outputs/apk/release/app-release.apk" 2>/dev/null || true)
          fi

          SHA1=$(echo "$CERT_INFO" | grep -i "SHA-1 digest:" | head -n 1 | awk -F': ' '{print $2}' | tr -d '[:space:]' | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]' || true)
          SHA256=$(echo "$CERT_INFO" | grep -i "SHA-256 digest:" | head -n 1 | awk -F': ' '{print $2}' | tr -d '[:space:]' | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]' || true)

          if [ -z "$SHA1" ] && [ -f ~/.android/debug.keystore ]; then
            KEY_OUT=$(keytool -list -v -keystore ~/.android/debug.keystore -alias "${ANDROID_KEY_ALIAS:-androiddebugkey}" -storepass "${ANDROID_KEYSTORE_PASSWORD:-android}" 2>/dev/null || true)
            SHA1=$(echo "$KEY_OUT" | grep -i "SHA1:" | head -n 1 | sed 's/.*SHA1:[[:space:]]*//' | tr -d '[:space:]' || true)
            SHA256=$(echo "$KEY_OUT" | grep -i "SHA256:" | head -n 1 | sed 's/.*SHA256:[[:space:]]*//' | tr -d '[:space:]' || true)
          fi

          echo "sha1=${SHA1:-Not available}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256:-Not available}" >> "$GITHUB_OUTPUT"

          echo "========================================================"
          echo "APK SHA-1  : ${SHA1:-Not available}"
          echo "APK SHA-256: ${SHA256:-Not available}"
          echo "========================================================"

          {
            echo "## SocialIndia APK Signing Fingerprints"
            echo ""
            echo "- **Package Name:** \`us.ci.socialindia\`"
            echo "- **SHA-1:** \`${SHA1:-Not available}\`"
            echo "- **SHA-256:** \`${SHA256:-Not available}\`"
            echo ""
            echo "> **Note:** Chrome Custom Tab Google Sign-In works even without adding SHA-1. Add SHA-1 in Firebase Console only if you also configure \`GOOGLE_WEB_CLIENT_ID\` for the native Google account picker."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Free Artifact Storage (Delete Older Artifacts)
        run: |
          echo "Cleaning up older artifacts to stay within GitHub free storage quota..."
          gh api -X GET "repos/${{ github.repository }}/actions/artifacts?per_page=30" --jq '.artifacts[] | .id' 2>/dev/null | tail -n +3 | while read -r id; do
            if [ -n "$id" ]; then
              echo "Removing old artifact $id..."
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" 2>/dev/null || true
            fi
          done || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload Release APK (Recommended for Sharing)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SocialIndia-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SocialIndia-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 1

      - name: Publish to GitHub Releases (Direct Download - No Quota Limit)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-apk
          name: "SocialIndia Android APK (Latest Build)"
          body: |
            Automated Android build from commit ${{ github.sha }}.
            
            - **Release APK:** `app-release.apk`
            - **Debug APK:** `app-debug.apk`
            - **SHA-1:** `${{ steps.certs.outputs.sha1 }}`
            - **SHA-256:** `${{ steps.certs.outputs.sha256 }}`
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


