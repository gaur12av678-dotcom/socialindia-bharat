
# Backend API routes (/api/**) are handled by Cloudflare Pages
# Do not add /api rewrites to firebase.json
name: Deploy to Firebase Hosting (socialindia)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          CI: false
          NODE_ENV: production

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build successful: $(ls dist | wc -l) files found"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Create Firebase config
        run: |
          PROJECT_ID=$(node -e "try { const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT); console.log(sa.project_id || 'socialindia-96fa1'); } catch(e) { console.log('socialindia-96fa1'); }")
          echo "{\"projects\":{\"default\":\"$PROJECT_ID\"}}" > .firebaserc
          echo '{
            "hosting": {
              "site": "socialindia",
              "public": "dist",
              "ignore": [
                "firebase.json",
                "**/.*",
                "**/node_modules/**",
                "**/*.log",
                "README.md",
                "package*.json"
              ],
              "rewrites": [
                {
                  "source": "**",
                  "destination": "/index.html"
                }
              ]
            }
          }' > firebase.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json
          export GOOGLE_APPLICATION_CREDENTIALS=serviceAccount.json
          PROJECT_ID=$(node -e "try { const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT); console.log(sa.project_id || 'socialindia-96fa1'); } catch(e) { console.log('socialindia-96fa1'); }")
          echo "Deploying to Firebase project: $PROJECT_ID"
          if firebase deploy --only hosting:socialindia --project "$PROJECT_ID" --non-interactive; then
            echo "Successfully deployed to site socialindia on project $PROJECT_ID"
          else
            echo "Target site socialindia not found or errored; falling back to default hosting on $PROJECT_ID..."
            node -e "
              const fs = require('fs');
              const f = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
              if (f.hosting) delete f.hosting.site;
              fs.writeFileSync('firebase.json', JSON.stringify(f, null, 2));
            "
            firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive
          fi
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
